name: "Matter & Thread AI Diagnostics"
slug: "matter_thread_ai_diagnostics"
version: "1.0.3"
description: "AI-powered diagnostic engine for Matter-over-Thread mesh stability, border router synchronization, and IPv6 reachability on Home Assistant Green."
url: "https://github.com/aaronwatt91/matter-thread-diagnostics"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:resistor-nodes"
panel_title: "Matter & Thread AI"
homeassistant_api: true
hassio_api: true
stage: stable

options:
  ai_provider: "gemini"
  ai_model: "gemini-2.0-flash"
  gemini_api_key: ""
  openai_api_key: ""
  anthropic_api_key: ""
  matter_server_url: "ws://core-matter-server:5580/ws"
  otbr_url: "http://core-openthread-border-router:8081"
  log_level: "info"

schema:
  ai_provider: str
  ai_model: str?
  gemini_api_key: password?
  openai_api_key: password?
  anthropic_api_key: password?
  matter_server_url: str?
  otbr_url: str?
  log_level: str?
