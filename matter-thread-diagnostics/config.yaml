name: "Matter & Thread AI Diagnostics"
slug: "matter_thread_ai_diagnostics"
version: "2.3.0"
description: "Real-time Matter-over-Thread network scanner, Cluster 0x0035 telemetry inspector, mDNS Border Router discovery, IPv6 reachability tester, and AI diagnostic engine for Home Assistant."
url: "https://github.com/aaronwatt91/matter-thread-diagnostics"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:resistor-nodes"
panel_title: "Matter & Thread AI"
homeassistant_api: true
hassio_api: true
hassio_role: manager
stage: stable

options:
  ai_provider: "gemini"
  ai_model: "gemini-2.5-flash"
  gemini_api_key: ""
  openai_api_key: ""
  anthropic_api_key: ""
  matter_server_url: "ws://core-matter-server:5580/ws"
  otbr_url: "http://core-openthread-border-router:8081"
  log_level: "info"
  target_thread_network: ""

schema:
  ai_provider: str
  ai_model: str?
  gemini_api_key: password?
  openai_api_key: password?
  anthropic_api_key: password?
  matter_server_url: str?
  otbr_url: str?
  log_level: str?
  target_thread_network: str?
